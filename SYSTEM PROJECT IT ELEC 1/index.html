<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Grade & Evaluation System</title>
    <!-- Tailwind CSS for rapid layout grid -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 16px;
        }

        .glass-sidebar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Accent Gradients */
        .gradient-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        }

        .gradient-header {
            background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Active Navigation Highlight */
        .nav-item-active {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.15) 0%, rgba(79, 70, 229, 0.05) 100%);
            border-left: 4px solid #6366f1;
            color: #ffffff;
        }

        .nav-item-inactive {
            border-left: 4px solid transparent;
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .nav-item-inactive:hover {
            background: rgba(255, 255, 255, 0.02);
            color: #e2e8f0;
            border-left: 4px solid rgba(99, 102, 241, 0.4);
        }

        /* Custom inputs styling */
        .custom-input {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .custom-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
            background-color: rgba(15, 23, 42, 0.85);
        }

        /* Custom Table Styling */
        .table-responsive {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-table th {
            background-color: rgba(15, 23, 42, 0.8);
            color: #cbd5e1;
            font-weight: 600;
        }

        .custom-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(30, 41, 59, 0.3);
            transition: background 0.2s;
        }

        .custom-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Metric Highlights */
        .card-gwa {
            border-left: 5px solid #6366f1;
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.05) 0%, rgba(30, 41, 59, 0.7) 100%);
        }

        .card-passed {
            border-left: 5px solid #10b981;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.05) 0%, rgba(30, 41, 59, 0.7) 100%);
        }

        .card-failed {
            border-left: 5px solid #ef4444;
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.05) 0%, rgba(30, 41, 59, 0.7) 100%);
        }

        .card-deans {
            border-left: 5px solid #f59e0b;
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.05) 0%, rgba(30, 41, 59, 0.7) 100%);
            animation: glow-pulse 2.5s infinite alternate;
        }

        .card-not-eligible {
            border-left: 5px solid #64748b;
            background: linear-gradient(180deg, rgba(100, 116, 139, 0.05) 0%, rgba(30, 41, 59, 0.7) 100%);
        }

        @keyframes glow-pulse {
            from {
                box-shadow: 0 0 10px rgba(245, 158, 11, 0.1);
            }

            to {
                box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
                border-color: #fbbf24;
            }
        }

        /* Custom buttons styling */
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col md:flex-row">

    <!-- SIDEBAR -->
    <aside class="w-full md:w-64 glass-sidebar flex flex-col md:min-h-screen text-slate-300">
        <!-- Brand Header -->
        <div class="p-6 flex flex-col items-center justify-center border-b border-white/5">
            <div
                class="w-16 h-16 mb-3 rounded-full flex items-center justify-center bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-2xl shadow-inner">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-100 tracking-tight">GradeSys Portal</h2>
            <span class="text-xs text-indigo-400 mt-1">Academic Evaluation Portal</span>
        </div>

        <!-- Role Switcher -->
        <div class="p-4 border-b border-white/5">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2">Select Access
                Role</label>
            <div class="relative">
                <select id="roleSelector"
                    class="w-full px-3 py-2 bg-slate-900 border border-white/10 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <option value="instructor">Instructor Dashboard</option>
                    <option value="student">Student Dashboard</option>
                </select>
            </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="flex-1 p-4 space-y-1" id="sidebarNav">
            <!-- Navigation will be populated dynamically -->
        </nav>

        <div class="p-4 border-t border-white/5 text-center text-xs text-slate-500">
            &copy; 2026 GradeSys App
        </div>
    </aside>

    <!-- MAIN MAIN VIEW -->
    <main class="flex-1 p-6 md:p-10 max-w-7xl mx-auto w-full overflow-y-auto">
        <!-- Dynamic Page Header -->
        <header
            class="gradient-header p-6 rounded-2xl mb-8 flex flex-col sm:flex-row sm:justify-between sm:items-center shadow-lg"
            id="pageHeader">
            <!-- Header title loaded dynamically -->
        </header>

        <!-- APP CONTENT ROOT -->
        <div id="appContent">
            <!-- Loaded Views render here -->
        </div>
    </main>

    <!-- SCRIPTS FOR DATA MODEL & RENDERS -->
    <script>
        // Define Database Seeds
        const DEFAULT_STUDENTS = [
            { student_id: "2026-0001", first_name: "Alice", last_name: "Smith", program: "BS Computer Science" },
            { student_id: "2026-0002", first_name: "Bob", last_name: "Johnson", program: "BS Information Technology" },
            { student_id: "2026-0003", first_name: "Charlie", last_name: "Brown", program: "BS Software Engineering" }
        ];

        const DEFAULT_SUBJECTS = [
            { subject_id: 1, subject_code: "CS101", subject_name: "Introduction to Programming", units: 3.0 },
            { subject_id: 2, subject_code: "CS102", subject_name: "Data Structures & Algorithms", units: 4.0 },
            { subject_id: 3, subject_code: "MATH101", subject_name: "Calculus I", units: 4.0 },
            { subject_id: 4, subject_code: "ENG101", subject_name: "Technical Communication", units: 3.0 }
        ];

        const DEFAULT_GRADES = [
            // Alice
            { grade_id: 1, student_id: "2026-0001", subject_id: 1, numerical_grade: 92.5 },
            { grade_id: 2, student_id: "2026-0001", subject_id: 2, numerical_grade: 89.0 },
            { grade_id: 3, student_id: "2026-0001", subject_id: 3, numerical_grade: 90.0 },
            { grade_id: 4, student_id: "2026-0001", subject_id: 4, numerical_grade: 88.0 },
            // Bob
            { grade_id: 5, student_id: "2026-0002", subject_id: 1, numerical_grade: 85.0 },
            { grade_id: 6, student_id: "2026-0002", subject_id: 2, numerical_grade: 78.0 },
            { grade_id: 7, student_id: "2026-0002", subject_id: 3, numerical_grade: 82.0 },
            { grade_id: 8, student_id: "2026-0002", subject_id: 4, numerical_grade: 75.0 },
            // Charlie
            { grade_id: 9, student_id: "2026-0003", subject_id: 1, numerical_grade: 80.0 },
            { grade_id: 10, student_id: "2026-0003", subject_id: 2, numerical_grade: 68.0 },
            { grade_id: 11, student_id: "2026-0003", subject_id: 3, numerical_grade: 72.0 },
            { grade_id: 12, student_id: "2026-0003", subject_id: 4, numerical_grade: 74.0 }
        ];

        // Database Controller Object
        const DB = {
            init: function () {
                if (!localStorage.getItem("STUDENT")) {
                    localStorage.setItem("STUDENT", JSON.stringify(DEFAULT_STUDENTS));
                }
                if (!localStorage.getItem("SUBJECT")) {
                    localStorage.setItem("SUBJECT", JSON.stringify(DEFAULT_SUBJECTS));
                }
                if (!localStorage.getItem("GRADE")) {
                    localStorage.setItem("GRADE", JSON.stringify(DEFAULT_GRADES));
                }
                this.recalculateAll();
            },

            getTable: function (name) {
                return JSON.parse(localStorage.getItem(name) || "[]");
            },

            saveTable: function (name, data) {
                localStorage.setItem(name, JSON.stringify(data));
            },

            // Student operations
            getStudents: function () { return this.getTable("STUDENT"); },
            getStudent: function (id) { return this.getStudents().find(s => s.student_id === id); },
            addStudent: function (student) {
                const studs = this.getStudents();
                if (studs.some(s => s.student_id === student.student_id)) {
                    throw new Error("Student ID already exists!");
                }
                studs.push(student);
                this.saveTable("STUDENT", studs);
            },
            deleteStudent: function (id) {
                let studs = this.getStudents();
                studs = studs.filter(s => s.student_id !== id);
                this.saveTable("STUDENT", studs);

                // Cascade delete grades and evaluations
                let grades = this.getTable("GRADE");
                grades = grades.filter(g => g.student_id !== id);
                this.saveTable("GRADE", grades);

                let evals = this.getTable("ACADEMIC_EVALUATION");
                evals = evals.filter(e => e.student_id !== id);
                this.saveTable("ACADEMIC_EVALUATION", evals);
            },

            // Subject operations
            getSubjects: function () { return this.getTable("SUBJECT"); },
            getSubject: function (id) { return this.getSubjects().find(s => s.subject_id === parseInt(id)); },
            addSubject: function (subject) {
                const subs = this.getSubjects();
                if (subs.some(s => s.subject_code.toUpperCase() === subject.subject_code.toUpperCase())) {
                    throw new Error("Subject Code already exists!");
                }
                // Generate next autoincrement ID
                const maxId = subs.reduce((max, s) => s.subject_id > max ? s.subject_id : max, 0);
                subject.subject_id = maxId + 1;
                subs.push(subject);
                this.saveTable("SUBJECT", subs);
            },
            deleteSubject: function (id) {
                const targetId = parseInt(id);
                let subs = this.getSubjects();
                subs = subs.filter(s => s.subject_id !== targetId);
                this.saveTable("SUBJECT", subs);

                // Cascade delete grades
                let grades = this.getTable("GRADE");
                grades = grades.filter(g => g.subject_id !== targetId);
                this.saveTable("GRADE", grades);

                // Recalculate evaluations
                this.recalculateAll();
            },

            // Grades operations
            getGradesForStudent: function (studentId) {
                const grades = this.getTable("GRADE");
                const subs = this.getSubjects();
                return grades
                    .filter(g => g.student_id === studentId)
                    .map(g => {
                        const s = subs.find(sub => sub.subject_id === g.subject_id);
                        return {
                            grade_id: g.grade_id,
                            subject_id: g.subject_id,
                            subject_code: s ? s.subject_code : "Unknown",
                            subject_name: s ? s.subject_name : "Unknown",
                            units: s ? s.units : 0,
                            numerical_grade: g.numerical_grade
                        };
                    })
                    .sort((a, b) => a.subject_code.localeCompare(b.subject_code));
            },
            upsertGrade: function (studentId, subjectId, gradeValue) {
                const grades = this.getTable("GRADE");
                const subId = parseInt(subjectId);
                const val = parseFloat(gradeValue);

                const existingIndex = grades.findIndex(g => g.student_id === studentId && g.subject_id === subId);
                if (existingIndex > -1) {
                    grades[existingIndex].numerical_grade = val;
                } else {
                    const maxId = grades.reduce((max, g) => g.grade_id > max ? g.grade_id : max, 0);
                    grades.push({
                        grade_id: maxId + 1,
                        student_id: studentId,
                        subject_id: subId,
                        numerical_grade: val
                    });
                }
                this.saveTable("GRADE", grades);
                this.recalculateStudentEvaluation(studentId);
            },
            deleteGrade: function (gradeId) {
                const gId = parseInt(gradeId);
                let grades = this.getTable("GRADE");
                const target = grades.find(g => g.grade_id === gId);
                if (!target) return;

                const studentId = target.student_id;
                grades = grades.filter(g => g.grade_id !== gId);
                this.saveTable("GRADE", grades);
                this.recalculateStudentEvaluation(studentId);
            },

            // Evaluation Core Engine (Business Logic)
            recalculateStudentEvaluation: function (studentId) {
                const grades = this.getGradesForStudent(studentId);
                const evals = this.getTable("ACADEMIC_EVALUATION");
                const existingIndex = evals.findIndex(e => e.student_id === studentId);

                if (grades.length === 0) {
                    // Remove evaluation if no grades logged
                    if (existingIndex > -1) {
                        evals.splice(existingIndex, 1);
                        this.saveTable("ACADEMIC_EVALUATION", evals);
                    }
                    return;
                }

                // Calculate GWA
                let totalWeighted = 0;
                let totalUnits = 0;
                let subjectGrades = [];

                grades.forEach(g => {
                    totalWeighted += g.numerical_grade * g.units;
                    totalUnits += g.units;
                    subjectGrades.push(g.numerical_grade);
                });

                const average = totalUnits > 0 ? Math.round((totalWeighted / totalUnits) * 100) / 100 : 0;

                // Pass/Fail Status Rule
                // Passed if average >= 75.0 AND no subject below 70.0; otherwise Failed.
                const hasFailedSubject = subjectGrades.some(g => g < 70.0);
                const passFailStatus = (average >= 75.0 && !hasFailedSubject) ? "Passed" : "Failed";

                // Dean's Lister Eligibility Rule
                // Dean's Lister if average >= 88.0 AND no subject below 80.0; otherwise Not Eligible.
                const hasSubBelowDL = subjectGrades.some(g => g < 80.0);
                const deansListStatus = (average >= 88.0 && !hasSubBelowDL) ? "Dean's Lister" : "Not Eligible";

                const newEval = {
                    student_id: studentId,
                    calculated_average: average,
                    pass_fail_status: passFailStatus,
                    deans_list_status: deansListStatus
                };

                if (existingIndex > -1) {
                    evals[existingIndex] = newEval;
                } else {
                    evals.push(newEval);
                }
                this.saveTable("ACADEMIC_EVALUATION", evals);
            },

            recalculateAll: function () {
                const students = this.getStudents();
                localStorage.setItem("ACADEMIC_EVALUATION", JSON.stringify([]));
                students.forEach(s => {
                    this.recalculateStudentEvaluation(s.student_id);
                });
            },

            getEvaluations: function () {
                const studs = this.getStudents();
                const evals = this.getTable("ACADEMIC_EVALUATION");
                return studs.map(s => {
                    const e = evals.find(ev => ev.student_id === s.student_id);
                    return {
                        student_id: s.student_id,
                        first_name: s.first_name,
                        last_name: s.last_name,
                        program: s.program,
                        calculated_average: e ? e.calculated_average : null,
                        pass_fail_status: e ? e.pass_fail_status : "-",
                        deans_list_status: e ? e.deans_list_status : "-"
                    };
                }).sort((a, b) => a.last_name.localeCompare(b.last_name));
            }
        };

        // Initialize Database
        DB.init();

        // -------------------------------------------------------------
        // APPLICATION STATE & UI DISPATCH ROUTER
        // -------------------------------------------------------------
        const State = {
            currentRole: "instructor", // instructor | student
            currentTab: "report",      // instructor: report, grades, students, subjects | student: main

            setRole: function (role) {
                this.currentRole = role;
                if (role === "instructor") {
                    this.currentTab = "report";
                } else {
                    this.currentTab = "main";
                }
                this.renderNavigation();
                this.renderHeader();
                this.renderView();
            },

            setTab: function (tab) {
                this.currentTab = tab;
                this.renderNavigation();
                this.renderView();
            },

            renderNavigation: function () {
                const nav = document.getElementById("sidebarNav");
                nav.innerHTML = "";

                if (this.currentRole === "instructor") {
                    const items = [
                        { id: "report", label: "Grade Report", icon: "fa-chart-simple" },
                        { id: "grades", label: "Enter Grades", icon: "fa-pen-to-square" },
                        { id: "students", label: "Manage Students", icon: "fa-users" },
                        { id: "subjects", label: "Manage Subjects", icon: "fa-book" }
                    ];

                    items.forEach(item => {
                        const active = this.currentTab === item.id;
                        nav.innerHTML += `
                            <button onclick="State.setTab('${item.id}')" class="w-full flex items-center px-4 py-3 text-sm rounded-xl text-left ${active ? 'nav-item-active' : 'nav-item-inactive'}">
                                <i class="fa-solid ${item.icon} mr-3 text-lg opacity-80"></i>
                                <span>${item.label}</span>
                            </button>
                        `;
                    });
                } else {
                    nav.innerHTML = `
                        <button class="w-full flex items-center px-4 py-3 text-sm rounded-xl text-left nav-item-active">
                            <i class="fa-solid fa-id-card-clip mr-3 text-lg opacity-80"></i>
                            <span>View My Grades</span>
                        </button>
                    `;
                }
            },

            renderHeader: function () {
                const header = document.getElementById("pageHeader");
                if (this.currentRole === "instructor") {
                    header.innerHTML = `
                        <div>
                            <h1 class="text-2xl font-bold text-slate-100 tracking-tight">Instructor Portal</h1>
                            <p class="text-sm text-indigo-300 mt-1">Manage profiles, evaluate averages, and generate records.</p>
                        </div>
                        <div class="mt-4 sm:mt-0 px-4 py-2 bg-indigo-900/40 rounded-xl border border-indigo-400/20 text-xs text-indigo-300 flex items-center">
                            <i class="fa-solid fa-lock mr-2"></i> Authorized Personnel Only
                        </div>
                    `;
                } else {
                    header.innerHTML = `
                        <div>
                            <h1 class="text-2xl font-bold text-slate-100 tracking-tight">Student Portal</h1>
                            <p class="text-sm text-indigo-300 mt-1">Query GWA stands and breakdown report card evaluations.</p>
                        </div>
                        <div class="mt-4 sm:mt-0 px-4 py-2 bg-indigo-900/40 rounded-xl border border-indigo-400/20 text-xs text-indigo-300 flex items-center">
                            <i class="fa-solid fa-user-graduate mr-2"></i> Self-Service Panel
                        </div>
                    `;
                }
            },

            renderView: function () {
                const container = document.getElementById("appContent");
                container.innerHTML = "";

                if (this.currentRole === "instructor") {
                    if (this.currentTab === "report") {
                        Views.instructorReport(container);
                    } else if (this.currentTab === "grades") {
                        Views.instructorGrades(container);
                    } else if (this.currentTab === "students") {
                        Views.instructorStudents(container);
                    } else if (this.currentTab === "subjects") {
                        Views.instructorSubjects(container);
                    }
                } else {
                    Views.studentDashboard(container);
                }
            }
        };

        // -------------------------------------------------------------
        // RENDER VIEWS TEMPLATES
        // -------------------------------------------------------------
        const Views = {
            instructorReport: function (el) {
                const evaluations = DB.getEvaluations();
                const total = evaluations.length;
                const passed = evaluations.filter(e => e.pass_fail_status === "Passed").length;
                const failed = evaluations.filter(e => e.pass_fail_status === "Failed").length;
                const deans = evaluations.filter(e => e.deans_list_status === "Dean's Lister").length;

                el.innerHTML = `
                    <div class="space-y-6">
                        <!-- Summary Stats -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="glass-card p-4 flex flex-col items-center">
                                <span class="text-xs text-slate-400 uppercase tracking-wide font-medium">Registered</span>
                                <span class="text-3xl font-bold text-indigo-400 mt-1">${total}</span>
                            </div>
                            <div class="glass-card p-4 flex flex-col items-center border-l-4 border-emerald-500">
                                <span class="text-xs text-slate-400 uppercase tracking-wide font-medium">Passed</span>
                                <span class="text-3xl font-bold text-emerald-400 mt-1">${passed}</span>
                            </div>
                            <div class="glass-card p-4 flex flex-col items-center border-l-4 border-rose-500">
                                <span class="text-xs text-slate-400 uppercase tracking-wide font-medium">Failed</span>
                                <span class="text-3xl font-bold text-rose-400 mt-1">${failed}</span>
                            </div>
                            <div class="glass-card p-4 flex flex-col items-center border-l-4 border-amber-500 animate-pulse">
                                <span class="text-xs text-slate-400 uppercase tracking-wide font-medium">Dean's List</span>
                                <span class="text-3xl font-bold text-amber-400 mt-1">${deans}</span>
                            </div>
                        </div>

                        <!-- Class Grade Report Card -->
                        <div class="glass-card p-6">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                                <h3 class="text-lg font-semibold text-slate-100">Class Evaluation Directory</h3>
                                <div class="w-full sm:w-64 relative">
                                    <input type="text" id="classSearch" placeholder="Search by ID, name..." class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-white/10 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                                    <i class="fa-solid fa-search absolute left-3 top-3 text-xs text-slate-500"></i>
                                </div>
                            </div>
                            
                            <div class="table-responsive">
                                <table class="custom-table w-full text-left border-collapse" id="reportTable">
                                    <thead>
                                        <tr class="text-slate-300 text-sm">
                                            <th class="p-4">Student ID</th>
                                            <th class="p-4">Student Name</th>
                                            <th class="p-4">Program</th>
                                            <th class="p-4 text-right">GWA</th>
                                            <th class="p-4 text-center">Standing</th>
                                            <th class="p-4 text-center">Dean's Lister</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm">
                                        <!-- Populated via Javascript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                // Render Table rows dynamically

                    const studentId = gradeStudent.value;
                    const studentObj = students.find(s => s.student_id === studentId);
                    previewName.innerText = studentObj ? `${studentObj.student_id} - ${studentObj.last_name}, ${studentObj.first_name}` : "";

                    const grades = DB.getGradesForStudent(studentId);

                    if (grades.length === 0) {

                                        <div class="stat-value text-indigo-400">${gwaVal}</div>
                                        <div class="stat-desc">Based on credit units</div>
                                    </div>
                                    <div class="stat-card ${passClass}">
                                        <div class="stat-label">Academic Status</div>
                                        <div class="stat-value-text font-bold ${evaluation ? (evaluation.pass_fail_status === 'Passed' ? 'text-emerald-400' : 'text-rose-400') : 'text-slate-400'} mt-1">${passLabel}</div>
                                        <div class="stat-desc mt-2">${passDesc}</div>
                                    </div>
                                    <div class="stat-card ${dlClass}">
                                        <div class="stat-label">Dean's Lister Standing</div>
                                        <div class="stat-value-text font-bold ${evaluation && evaluation.deans_list_status === "Dean's Lister" ? 'text-amber-400' : 'text-slate-400'} mt-1">${dlLabel}</div>
                                        <div class="stat-desc mt-2">${dlDesc}</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Subject breakdown -->
                            <div class="glass-card p-6">
                                <h3 class="text-lg font-bold text-slate-100 mb-4">Detailed Academic Report Card</h3>
                                <div class="table-responsive">
                                    <table class="custom-table w-full text-left border-collapse">
                                        <thead>
                                            <tr class="text-slate-300 text-xs uppercase">
                                                <th class="p-4">Subject Code</th>
                                                <th class="p-4">Course Name</th>
                                                <th class="p-4 text-center">Credit Units</th>
                                                <th class="p-4 text-right">Numerical Grade</th>
                                                <th class="p-4 text-center">Remark</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${rows}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }

                refreshDashboard();
                selector.addEventListener("change", refreshDashboard);
            }
        };

        // Initialize Layout dispatchers
        const roleSelector = document.getElementById("roleSelector");
        roleSelector.addEventListener("change", (e) => {
            State.setRole(e.target.value);
        });

        // First Load
        State.setRole("instructor");
    </script>
</body>

</html>
